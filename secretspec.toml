#:schema https://secretspec.dev/schema/secretspec.schema.json
#
# Declarations only. Values live in the SOPS file configured below and are
# decrypted by the SecretSpec resolver at runtime.

[project]
name = "celine"
revision = "1.0"

[providers]
celine_secrets = "sops://secrets/celine.enc.yaml"

[profiles.default]
KAVITA_TOKEN_KEY = { description = "Kavita JWT signing key (64 random bytes, base64)", type = "base64", generate = { bytes = 64 } }

[profiles.default.defaults]
providers = ["celine_secrets"]
