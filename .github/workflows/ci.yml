name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test ./...

      - name: go build
        run: |
          mkdir -p build
          go build -o build/celine ./cmd/celine

      - name: boot script dry run
        run: ./scripts/install-boot.sh --dry-run
