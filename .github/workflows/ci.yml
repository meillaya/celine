name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: install test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y sqlite3 shellcheck

      - name: gofmt
        run: test -z "$(gofmt -l cmd internal)"

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test -race -count=1 ./...

      - name: go build
        run: |
          mkdir -p build
          go build -o build/celine ./cmd/celine

      - name: shellcheck
        run: shellcheck scripts/*.sh

      - name: render drift
        run: |
          ./build/celine render --out build
          ./build/celine render --check

      - name: systemd units
        run: |
          ./build/celine systemd render --out build/systemd
          systemd-analyze verify build/systemd/*.service build/systemd/*.timer

      - name: boot script dry run
        run: ./scripts/install-boot.sh --dry-run
