# Railway-optimized Kavita Configuration
# 
# IMPORTANT STORAGE LIMITATIONS:
# - Free plan: 0.5GB volume limit
# - Hobby plan: 5GB volume limit  
# - Pro plan: 50GB volume limit
#
# For larger libraries, you'll need external storage (S3, Cloudflare R2, etc.)
# and configure Kavita to use those via environment variables or mount points.

name: kavita

services:
  kavita:
    container_name: kavita
    image: lscr.io/linuxserver/kavita:latest
    environment:
      - PUID=0
      - PGID=0
      - TZ=${TZ:-Etc/UTC}
      # Railway provides the PORT env variable dynamically
    volumes:
      # Persistent config storage
      - kavita-config:/config
      # Media library storage (limited by plan)
      - kavita-data:/data
    ports:
      - '${PORT:-5000}:5000'
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  kavita-config:
  kavita-data: